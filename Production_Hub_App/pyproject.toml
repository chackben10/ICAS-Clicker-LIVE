[project]
name = "production-hub"
version = "0.1.0"
description = "Production automation, integrations, and diagnostics."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "PySide6>=6.8",
  "httpx>=0.27",
  "obsws-python>=1.7",
  "qrcode[pil]>=7.4",
  "mido>=1.3",
  "python-rtmidi>=1.5",
  "pyobjc-framework-Quartz>=10.3; sys_platform == 'darwin'",
]

[project.optional-dependencies]
build = [
  "pyinstaller>=6.10",
]
test = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-timeout>=2.3",
  "pytest-qt>=4.4",
  "pytest-json-report>=1.5",
  "pytest-html>=4.1",
  "playwright>=1.46",
  "pytest-playwright>=0.5",
  "respx>=0.21",
  "psutil>=6.0",
  "websockets>=13.0",
]

[project.scripts]
production-hub = "production_hub.app.main:main"
